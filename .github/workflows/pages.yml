# Deploy the static site to GitHub Pages via GitHub Actions.
#
# This repo is a static SPA. The legacy Jekyll Pages builder kept
# failing ("Page build failed."), freezing the live site on an old deploy.
# This workflow uploads the repository (Jekyll is bypassed; .nojekyll is
# present) and publishes it, giving real build logs when something goes wrong.
#
# A check job runs FIRST and the deploy waits for it. Before, the data check
# was a separate workflow with no say over the deploy, and the page build was
# continue-on-error: a broken build-seo.mjs shipped a site with no album pages,
# no "What I shoot" pages (the model page loses its cards and PDFs) and a stale
# sitemap, while the deploy went green (Sep 2026 audit). Now a failure keeps
# the previous, working deploy live instead.
#
# The checks are the ones that are never wrong: data.js executes and parses,
# every photo file exists, the cache-buster matches, the pages build. Judgement
# calls (a promo code removed, prices re-cut) only print a warning, so they can
# never stop the studio publishing its own site.
#
# build-seo.mjs writes the pages search engines and link previews read (an HTML
# page per album, the service pages, the sitemap) from the published data.js,
# on this throwaway checkout only — nothing is committed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Once a day, 00:05 IST. A future-dated album is hidden until its date, and
  # its page is only written by a deploy — this is the deploy that writes it on
  # the day, without waiting for the next publish.
  schedule:
    - cron: "35 18 * * *"

# Allow the workflow to publish Pages and use OIDC for deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let an in-flight run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deep enough to reach the commit the branch was at before this push,
          # so a release made of several commits is judged as one.
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Published data is intact
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node .github/scripts/validate-data.mjs
      - name: Search-engine pages build
        run: node .github/scripts/build-seo.mjs --check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Not continue-on-error any more: the check job has already proved this
      # builds, so a failure here is real, and stopping keeps the last good
      # deploy live rather than replacing it with a site missing its pages.
      - name: Build search-engine pages (albums, services, sitemap)
        run: node .github/scripts/build-seo.mjs

      - name: Upload site artifact (repository root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
