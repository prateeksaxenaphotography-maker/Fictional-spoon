# Validates the published portfolio on every push — including the Admin
# Panel's auto-sync commits. Catches the failure class that used to blank
# the live site (data.js/app.js format drift, wiped albums, missing photo
# files) the moment it lands, instead of days later as a broken website.
# A red run emails the repo owner.
name: Validate portfolio data

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50 # enough to reach the commit this push started from
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node .github/scripts/validate-data.mjs
      # The deploy builds the album/service pages and the sitemap with this
      # script and carries on without them if it fails. This is where a failure
      # becomes visible: same script, writes nothing.
      - name: Search-engine pages still build
        if: always()
        run: node .github/scripts/build-seo.mjs --check
